function resizeCanvas() {
  // 读父容器 .anim-body 的可用尺寸，不要读 canvas 自己（避免被 style 锁死）
  const parent = canvas.parentElement;
  const rect = parent.getBoundingClientRect();
  // 减去 padding (16*2=32) 和 border
  const w = Math.max(100, rect.width - 32);
  const h = Math.max(100, rect.height - 32);
  canvas.width = w * dpr; canvas.height = h * dpr;
  // 不设 style.width/height，让 CSS 的 width:100%; height:100% 自适应
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// === 源码渲染 ===
function renderSource(file, highlightLines) {
  const lines = SOURCE_FILES[file] || [];
  sourceMeta.textContent = `${file}:${highlightLines[0]}-${highlightLines[1]}`;
  const lo = highlightLines[0], hi = highlightLines[1];
  let html = "";
  for (const ln of lines) {
    const cur = ln.n >= lo && ln.n <= hi;
    html += `<span class="source-line${cur ? " current" : ""}"><span class="ln${cur ? " current-ln" : ""}">${ln.n}</span>${ln.t}</span>\n`;
  }
  sourceBody.innerHTML = html;
  const first = sourceBody.querySelector(".current");
  if (first) first.scrollIntoView({ block: "center" });
}

// === 字幕渲染 ===
function renderNarration(scene) {
  const html = `<div class="narr-scene-title">${scene.title}</div>` +
    scene.narration.map(n => `
      <div class="narr-item${n.warn ? " warn" : ""}" data-t="${n.t}">
        <div class="narr-time">+${n.t}s</div>
        <div class="narr-text">${n.text}</div>
      </div>`).join("");
  narrBody.innerHTML = html;
}

function updateActiveNarration(scene, localTime) {
  const items = narrBody.querySelectorAll(".narr-item");
  let activeIdx = 0;
  for (let i = scene.narration.length - 1; i >= 0; i--) {
    if (localTime >= scene.narration[i].t) { activeIdx = i; break; }
  }
  items.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
  if (items[activeIdx]) items[activeIdx].scrollIntoView({ block: "center", behavior: "smooth" });
}

// === Canvas 工具 ===
function clearCanvas() {
  const r = canvas.getBoundingClientRect();
  ctx.fillStyle = "#0a0e14"; ctx.fillRect(0, 0, r.width, r.height);
}
function txt(s, x, y, o = {}) {
  ctx.font = o.font || "13px ui-monospace, 'SF Mono', Menlo, monospace";
  ctx.fillStyle = o.color || "#c9d1d9";
  ctx.textAlign = o.align || "left"; ctx.textBaseline = o.baseline || "top";
  ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r, o = {}) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 1; ctx.stroke(); }
}

// === 场景查找 ===
function getSceneAt(time) {
  for (let i = 0; i < TIMELINE.scenes.length; i++) {
    const s = TIMELINE.scenes[i];
    if (time >= s.start && time < s.start + s.duration) return { scene: s, index: i };
  }
  const last = TIMELINE.scenes[TIMELINE.scenes.length - 1];
  return { scene: last, index: TIMELINE.scenes.length - 1 };
}

// === 渲染当前帧 ===
function render() {
  const { scene, index } = getSceneAt(currentTime);
  const localProgress = Math.min(1, (currentTime - scene.start) / scene.duration);
  // 场景切换
  if (index !== currentSceneIndex) {
    currentSceneIndex = index;
    hideToasts();
    renderSource(scene.source.file, scene.source.lines);
    renderNarration(scene);
    transitionScene(() => {});
    sceneNumEl.textContent = index + 1;
    sceneTitleEl.textContent = scene.title;
    animSceneTitle.innerHTML = `Scene ${index + 1} · <b>${scene.title}</b>`;
    animMeta.textContent = scene.anim.type;
    // Scene 4 警告阶段触发 Toast
    if (scene.id === "s4" && localProgress > 0.7) {
      showToast("检测到高内存压力", "GCMark=Debug 实测可产生 <code>6442 万行 / 3.5GB</code> 日志<br>单条消息超过 1024 字节会被默默截断", 6000);
    }
  }
  updateActiveNarration(scene, currentTime - scene.start);
  // Scene 4 警告阶段触发 Toast (不限于场景切换那一刻)
  if (scene.id === "s4" && localProgress > 0.7 && localProgress < 0.75) {
    if (!toastContainer.querySelector(".toast")) {
      showToast("检测到高内存压力", "GCMark=Debug 实测可产生 <code>6442 万行 / 3.5GB</code> 日志<br>单条消息超过 1024 字节会被默默截断", 6000);
    }
  }
  // 动画
  const drawer = DRAWERS[scene.anim.type];
  if (drawer) drawer(localProgress);
  // 进度条
  progressFill.style.width = `${(currentTime / TOTAL_DURATION) * 100}%`;
  animProgressFill.style.width = `${localProgress * 100}%`;
  curTimeEl.textContent = `${currentTime.toFixed(1)}s`;
  // 场景标记
  const markers = progressMarkers.children;
  for (let i = 0; i < markers.length; i++) {
    markers[i].classList.toggle("active", i === index);
  }
}

// === 主循环 ===
function tick(now) {
  if (!isPlaying) return;
  if (!lastFrameTime) lastFrameTime = now;
  const dt = (now - lastFrameTime) / 1000;
  lastFrameTime = now;
  currentTime += dt * speed;
  if (currentTime >= TOTAL_DURATION) {
    currentTime = TOTAL_DURATION;
    isPlaying = false;
    btnPlay.textContent = "▶";
  }
  render();
  if (isPlaying) requestAnimationFrame(tick);
}

// === Toast 系统 ===
const toastContainer = document.getElementById("toastContainer");
function showToast(title, body, duration = 4000) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-body">${body}</div>`;
  toastContainer.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("show"));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 300);
  }, duration);
}
function hideToasts() {
  toastContainer.querySelectorAll(".toast").forEach(t => {
    t.classList.remove("show");
    setTimeout(() => t.remove(), 300);
  });
}

// === Scene 切换过渡 ===
let transitionTimeout = null;
function transitionScene(callback) {
  if (transitionTimeout) clearTimeout(transitionTimeout);
  document.querySelectorAll(".panel").forEach(p => p.classList.add("transitioning"));
  transitionTimeout = setTimeout(() => {
    callback();
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("transitioning"));
    transitionTimeout = null;
  }, 300);
}

// === 控件事件 ===
btnPlay.addEventListener("click", () => {
  if (currentTime >= TOTAL_DURATION) currentTime = 0;
  isPlaying = !isPlaying;
  btnPlay.textContent = isPlaying ? "⏸" : "▶";
  if (isPlaying) {
    lastFrameTime = 0;
    requestAnimationFrame(tick);
  }
});

document.getElementById("btnPrev").addEventListener("click", () => {
  const { scene } = getSceneAt(currentTime);
  const prevScene = TIMELINE.scenes[Math.max(0, currentSceneIndex - 1)];
  currentTime = prevScene ? prevScene.start : 0;
  if (currentTime === scene.start) currentTime = 0;
  render();
});

document.getElementById("btnNext").addEventListener("click", () => {
  const nextScene = TIMELINE.scenes[Math.min(TIMELINE.scenes.length - 1, currentSceneIndex + 1)];
  currentTime = nextScene.start;
  render();
});

document.getElementById("btnStepFwd").addEventListener("click", () => {
  const { scene } = getSceneAt(currentTime);
  const localTime = currentTime - scene.start;
  const nextKf = scene.keyframes.find(k => k > localTime + 0.01);
  if (nextKf !== undefined) {
    currentTime = scene.start + nextKf;
  } else {
    const nextScene = TIMELINE.scenes[Math.min(TIMELINE.scenes.length - 1, currentSceneIndex + 1)];
    currentTime = nextScene.start;
  }
  render();
});

document.getElementById("btnStepBack").addEventListener("click", () => {
  const { scene } = getSceneAt(currentTime);
  const localTime = currentTime - scene.start;
  const prevKfs = scene.keyframes.filter(k => k < localTime - 0.01);
  const prevKf = prevKfs.length ? prevKfs[prevKfs.length - 1] : 0;
  if (prevKfs.length > 0) {
    currentTime = scene.start + prevKf;
  } else {
    const prevScene = TIMELINE.scenes[Math.max(0, currentSceneIndex - 1)];
    currentTime = prevScene.start + (prevScene ? prevScene.duration : 0);
  }
  render();
});

speedSlider.addEventListener("input", (e) => {
  speed = parseFloat(e.target.value);
  speedValueEl.textContent = `${speed.toFixed(2)}x`;
});

document.getElementById("sceneProgress").addEventListener("click", (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  currentTime = ratio * TOTAL_DURATION;
  render();
});

// === 键盘快捷键 ===
document.addEventListener("keydown", (e) => {
  if (document.getElementById("introOverlay").classList.contains("hidden") === false) {
    if (e.code === "Space" || e.code === "Enter") { closeIntro(); e.preventDefault(); }
    return;
  }
  switch (e.code) {
    case "Space":
      e.preventDefault();
      btnPlay.click();
      break;
    case "ArrowRight":
      if (e.shiftKey) document.getElementById("btnNext").click();
      else document.getElementById("btnStepFwd").click();
      e.preventDefault();
      break;
    case "ArrowLeft":
      if (e.shiftKey) document.getElementById("btnPrev").click();
      else document.getElementById("btnStepBack").click();
      e.preventDefault();
      break;
  }
});

// === 开场覆盖层交互 ===
function closeIntro() {
  const intro = document.getElementById("introOverlay");
  if (intro.classList.contains("hidden")) return;
  intro.classList.add("fading");
  setTimeout(() => {
    intro.classList.add("hidden");
    resizeCanvas();
    render();
  }, 600);
}
document.getElementById("introOverlay").addEventListener("click", closeIntro);

// === 三区分隔条拖拽 ===
function setupDivider(divider, leftPanel, rightPanel, mainEl) {
  let dragging = false;
  divider.addEventListener("mousedown", (e) => {
    dragging = true;
    divider.classList.add("dragging");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
    e.preventDefault();
  });
  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const mainRect = mainEl.getBoundingClientRect();
    const leftRect = leftPanel.getBoundingClientRect();
    const rightRect = rightPanel.getBoundingClientRect();
    const total = leftRect.width + rightRect.width;
    const newLeft = Math.max(200, Math.min(total - 200, e.clientX - leftRect.left));
    leftPanel.style.flex = `0 0 ${newLeft}px`;
    rightPanel.style.flex = "1 1 0";
    // 任何一条分隔条拖动都会影响动画区(中间) 的尺寸，统一调用 resizeCanvas
    resizeCanvas();
    render();
  });
  document.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
  });
}

function initDividers() {
  const main = document.querySelector("main");
  const panels = main.querySelectorAll(".panel");
  const dividers = main.querySelectorAll(".panel-divider");
  setupDivider(dividers[0], panels[0], panels[1], main);
  setupDivider(dividers[1], panels[1], panels[2], main);
}

// === 初始化 ===
function init() {
  totalTimeEl.textContent = `${TOTAL_DURATION.toFixed(1)}s`;
  // 场景标记
  let markersHtml = "";
  for (let i = 0; i < TIMELINE.scenes.length; i++) {
    const s = TIMELINE.scenes[i];
    const pct = (s.start / TOTAL_DURATION) * 100;
    markersHtml += `<div class="scene-marker" style="left:${pct}%"></div>`;
  }
  progressMarkers.innerHTML = markersHtml;
  resizeCanvas();
  window.addEventListener("resize", () => { resizeCanvas(); render(); });
  initDividers();
  render();
}

init();
</script>
